# Variant C — Euclidean centroid distance as metric target
# SlotAttention + METRA-style metric loss using Euclidean distance.
# Tests whether any metric target (vs. none) improves slot quality.

_target_: rl4co.models.zoo.pomo_slot.POMOSlot

num_slots: 8
metric_variant: "C"       # Euclidean centroid distance target
alpha_metric: 0.1
beta_entropy: 0.01
slot_iters: 3
proj_dim: 64
lambda_init: 1.0
lr_dual: 1.0e-3

num_encoder_layers: 6
normalization: "instance"
use_graph_context: false
num_starts: null
num_augment: 8

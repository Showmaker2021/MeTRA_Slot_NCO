# Variant D — Insertion-cost metric target (PROPOSED METHOD)
# SlotAttention + METRA-style metric loss using precomputed d_ins as target.
# This is the main contribution — region distances track routing cost.

_target_: rl4co.models.zoo.pomo_slot.POMOSlot

num_slots: 8
metric_variant: "D"       # Insertion-cost distance target (PROPOSED)
alpha_metric: 0.1
beta_entropy: 0.01
slot_iters: 3
proj_dim: 64
lambda_init: 1.0
lr_dual: 1.0e-3
k_neighbors: 15   # kNN sparsification for on-the-fly d_ins computation (Variant D)

num_encoder_layers: 6
normalization: "instance"
use_graph_context: false
num_starts: null
num_augment: 8

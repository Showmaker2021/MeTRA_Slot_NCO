# Variant B — Task-loss only (DPN-style baseline)
# SlotAttention present but metric loss disabled (alpha=0).
# This is the DPN-style ablation: slots learned purely via policy gradient.

_target_: rl4co.models.zoo.pomo_slot.POMOSlot

num_slots: 8
metric_variant: "B"       # No metric loss
alpha_metric: 0.0         # Disabled
beta_entropy: 0.0         # No entropy regulariser either
slot_iters: 3

num_encoder_layers: 6
normalization: "instance"
use_graph_context: false
num_starts: null
num_augment: 8

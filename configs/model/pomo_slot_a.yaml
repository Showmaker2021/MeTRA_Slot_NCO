# Variant A — Reconstruction loss (MSE slot centroid vs node coords)
# No metric preservation loss; learn slot structure via reconstruction.

_target_: rl4co.models.zoo.pomo_slot.POMOSlot

# Slot configuration
num_slots: 8
metric_variant: "A"       # Reconstruction loss on centroid coords
alpha_metric: 0.1
beta_entropy: 0.01
slot_iters: 3

# POMO backbone
num_encoder_layers: 6
normalization: "instance"
use_graph_context: false
num_starts: null           # auto (= num_nodes)
num_augment: 8
